<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Design Intelligence, a six stage design stack for Claude Code">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="60%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cc2a3f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#cc2a3f" stop-opacity="0"/>
    </linearGradient>
    <style>
      .d  { font-family: 'Plus Jakarta Sans','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .m  { font-family: 'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#ground)"/>
  <rect x="0" y="0" width="1200" height="1" fill="#232323"/>
  <rect x="0" y="359" width="1200" height="1" fill="#232323"/>

  <!-- brand chip -->
  <rect x="72" y="56" width="146" height="30" fill="#cc2a3f"/>
  <text x="86" y="77" class="m" font-size="14" font-weight="600" letter-spacing="2.4" fill="#ffffff">DESIGNERAMA</text>

  <!-- title -->
  <text x="72" y="168" class="d" font-size="76" font-weight="800" letter-spacing="-2.6" fill="#f2f0ec">Design Intelligence</text>

  <!-- accent rule -->
  <rect x="72" y="196" width="420" height="3" fill="url(#rule)"/>

  <!-- tagline -->
  <text x="72" y="242" class="d" font-size="23" font-weight="500" fill="#a3a19d">Six stages between a brief and an interface that does not look generated.</text>

  <!-- stage chips -->
  <g class="m" font-size="13" font-weight="600" letter-spacing="1.1">
    <rect x="72"  y="278" width="118" height="30" rx="15" fill="none" stroke="#232323"/>
    <text x="97"  y="298" fill="#787671">S0 STRATEGY</text>

    <rect x="202" y="278" width="122" height="30" rx="15" fill="none" stroke="#232323"/>
    <text x="226" y="298" fill="#787671">S1 REFERENCE</text>

    <rect x="336" y="278" width="116" height="30" rx="15" fill="none" stroke="#232323"/>
    <text x="360" y="298" fill="#787671">S2 GENERATE</text>

    <rect x="464" y="278" width="96" height="30" rx="15" fill="none" stroke="#232323"/>
    <text x="489" y="298" fill="#787671">S3 AUDIT</text>

    <rect x="572" y="278" width="100" height="30" rx="15" fill="none" stroke="#232323"/>
    <text x="596" y="298" fill="#787671">S4 VERIFY</text>

    <rect x="684" y="278" width="106" height="30" rx="15" fill="none" stroke="#cc2a3f"/>
    <text x="707" y="298" fill="#cc2a3f">S5 DELIVER</text>
  </g>

  <!-- right side mark -->
  <g opacity="0.5">
    <circle cx="1044" cy="180" r="104" fill="none" stroke="#232323" stroke-width="1"/>
    <circle cx="1044" cy="180" r="72"  fill="none" stroke="#232323" stroke-width="1"/>
    <circle cx="1044" cy="180" r="40"  fill="none" stroke="#cc2a3f" stroke-width="2"/>
    <circle cx="1044" cy="180" r="7"   fill="#cc2a3f"/>
  </g>
</svg>
